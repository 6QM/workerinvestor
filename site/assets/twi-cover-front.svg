<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">The Worker Investor cover concept</title>
  <desc id="desc">A minimal modern paperback cover concept for The Worker Investor.</desc>
  <defs>
    <pattern id="paper-grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#15161a" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
    <linearGradient id="purple-rule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3fb4"/>
      <stop offset=".52" stop-color="#0d6b57"/>
      <stop offset="1" stop-color="#c6a64f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="#f6f4ed"/>
  <rect width="1200" height="1800" fill="url(#paper-grid)"/>
  <rect x="76" y="76" width="1048" height="1648" fill="none" stroke="#101114" stroke-opacity=".16" stroke-width="2"/>
  <rect x="76" y="76" width="1048" height="14" fill="url(#purple-rule)"/>
  <text x="104" y="156" fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" letter-spacing="5">BOOK CONCEPT V0.1</text>
  <text x="104" y="342" fill="#101114" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="126" font-weight="700">
    <tspan x="104" dy="0">The</tspan>
    <tspan x="104" dy="126">Worker</tspan>
    <tspan x="104" dy="126">Investor</tspan>
  </text>
  <text x="104" y="760" fill="#101114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="800">工资之外</text>
  <line x1="104" y1="860" x2="1096" y2="860" stroke="#101114" stroke-opacity=".2" stroke-width="2"/>
  <g transform="translate(104 942)">
    <text fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">
      <tspan x="0" dy="0">From Salary to Assets,</tspan>
      <tspan x="0" dy="64">From Work to Optionality.</tspan>
    </text>
  </g>
  <g transform="translate(104 1190)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700">
    <rect x="0" y="0" width="992" height="1.8" fill="#101114" opacity=".18"/>
    <text x="0" y="72" fill="#b85f3b">WAGES</text>
    <path d="M142 63H308" stroke="#101114" stroke-opacity=".35" stroke-width="3"/>
    <text x="342" y="72" fill="#0d6b57">ASSETS</text>
    <path d="M498 63H664" stroke="#101114" stroke-opacity=".35" stroke-width="3"/>
    <text x="698" y="72" fill="#4b3fb4">OPTIONALITY</text>
  </g>
  <g transform="translate(104 1468)">
    <text fill="#101114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">Qiaomai Liu / 刘乔迈</text>
    <text y="70" fill="#6a6f78" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700">A MODERN NONFICTION BOOK AND LIVING TOOLKIT</text>
  </g>
  <circle cx="1008" cy="1548" r="72" fill="#4b3fb4"/>
  <text x="1008" y="1568" text-anchor="middle" fill="#fffdf7" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">WI</text>
</svg>
