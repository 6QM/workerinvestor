<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Worker Investor 3D book mockup</title>
  <desc id="desc">A 3D-style book mockup with cover, spine, and open interior page.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="28" flood-color="#101114" flood-opacity=".25"/>
    </filter>
    <pattern id="page-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#101114" stroke-opacity=".055" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="cover-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset=".58" stop-color="#172033"/>
      <stop offset="1" stop-color="#4b3fb4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="#f6f4ed"/>
  <g filter="url(#shadow)">
    <path d="M455 212L1288 154L1364 988L526 1052Z" fill="#fffdf7" stroke="#101114" stroke-opacity=".16" stroke-width="3"/>
    <path d="M455 212L1288 154L1364 988L526 1052Z" fill="url(#page-grid)"/>
    <path d="M540 295L1264 245" stroke="#101114" stroke-opacity=".12" stroke-width="3"/>
    <path d="M555 408L1245 360" stroke="#101114" stroke-opacity=".12" stroke-width="3"/>
    <path d="M570 522L1232 475" stroke="#101114" stroke-opacity=".12" stroke-width="3"/>
    <text x="580" y="354" fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="800">CONTENTS</text>
    <text x="580" y="466" fill="#101114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="850">工资之外</text>
    <g fill="#343842" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">
      <text x="584" y="562">00 Preface</text>
      <text x="584" y="622">01 Worker Reality</text>
      <text x="584" y="682">02 Worker Investor Mindset</text>
      <text x="584" y="742">03 Human Capital ETF</text>
      <text x="584" y="802">04 Transformation Paths</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <path d="M260 250L516 214L528 1052L252 1000Z" fill="#07101f"/>
    <path d="M118 292L458 238L450 1010L108 944Z" fill="url(#cover-grad)" stroke="#050912" stroke-width="4"/>
    <path d="M108 944L252 1000L528 1052L450 1010Z" fill="#04070d"/>
    <path d="M118 292L260 250L516 214L458 238Z" fill="#334066"/>
    <text x="168" y="384" fill="#d8d4ca" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="800" letter-spacing="3">BOOK CONCEPT</text>
    <text x="168" y="524" fill="#fffdf7" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="68" font-weight="700">
      <tspan x="168" dy="0">The</tspan>
      <tspan x="168" dy="72">Worker</tspan>
      <tspan x="168" dy="72">Investor</tspan>
    </text>
    <text x="168" y="808" fill="#fffdf7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800">工资之外</text>
    <text transform="translate(326 906) rotate(-82)" fill="#fffdf7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="800">WI</text>
  </g>
  <text x="128" y="1100" fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">A book object for a long-running nonfiction project.</text>
