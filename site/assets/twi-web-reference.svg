  <g transform="translate(944 820)">
    <rect x="0" y="0" width="390" height="232" rx="10" fill="#fffdf7" stroke="#101114" stroke-opacity=".14"/>
    <rect x="18" y="18" width="354" height="6" fill="#c6a64f"/>
    <text x="22" y="70" fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="850">LIVING ARCHIVE</text>
    <text x="22" y="128" fill="#101114" font-family="Inter, sans-serif" font-size="30" font-weight="850">The site keeps growing.</text>
    <text x="22" y="174" fill="#343842" font-family="Inter, sans-serif" font-size="20">Posts, cases, appendix, references.</text>
