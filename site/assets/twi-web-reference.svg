      <tspan x="0" dy="0">工资之外，</tspan>
      <tspan x="0" dy="92">不是工作之外。</tspan>
    </text>
    <text y="330" fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="650">
      <tspan x="0" dy="0">A book about turning wages, skills, AI, writing,</tspan>
      <tspan x="0" dy="44">and investing into long-term assets and optionality.</tspan>
    </text>
    <rect x="0" y="418" width="214" height="54" rx="27" fill="#101114"/>
    <text x="107" y="453" text-anchor="middle" fill="#fffdf7" font-family="Inter, sans-serif" font-size="17" font-weight="850">Open the book</text>
    <rect x="230" y="418" width="214" height="54" rx="27" fill="#fffdf7" stroke="#101114" stroke-opacity=".18"/>
    <text x="337" y="453" text-anchor="middle" fill="#101114" font-family="Inter, sans-serif" font-size="17" font-weight="850">Explore resources</text>
  </g>
