    <text x="-48" y="198" fill="#fffdf7" font-family="Georgia, serif" font-size="34" font-weight="700">
      <tspan x="-48" dy="0">The</tspan>
      <tspan x="-48" dy="39">Worker</tspan>
      <tspan x="-48" dy="39">Investor</tspan>
    </text>
    <text x="-48" y="340" fill="#fffdf7" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="850">工资之外</text>
