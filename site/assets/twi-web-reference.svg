    <text x="22" y="70" fill="#8af1d3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="850">PRACTICE SYSTEM</text>
    <text x="22" y="128" fill="#fffdf7" font-family="Inter, sans-serif" font-size="30" font-weight="850">Reading becomes action.</text>
    <text x="22" y="174" fill="#d8d4ca" font-family="Inter, sans-serif" font-size="20">Sheets, self-assessment, 90-day plan.</text>
