  <text x="976" y="114" fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="750">Library</text>
  <text x="1080" y="114" fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="750">Appendix</text>
  <rect x="1216" y="86" width="88" height="40" rx="20" fill="#101114"/>
  <text x="1260" y="112" text-anchor="middle" fill="#fffdf7" font-family="Inter, sans-serif" font-size="15" font-weight="850">Join</text>
  <g transform="translate(104 222)">
    <text fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="850" letter-spacing="3">MODERN PAPERBACK + PRACTICAL TOOLKIT</text>
