    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#101114" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1440" height="1200" fill="#f6f4ed"/>
