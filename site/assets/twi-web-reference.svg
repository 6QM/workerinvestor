    <text x="22" y="70" fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="850">BOOK OBJECT</text>
    <text x="22" y="128" fill="#101114" font-family="Inter, sans-serif" font-size="30" font-weight="850">Make the book feel real.</text>
    <text x="22" y="174" fill="#343842" font-family="Inter, sans-serif" font-size="20">Cover, spine, contents, version notes.</text>
  </g>
  <g transform="translate(524 820)">
    <rect x="0" y="0" width="390" height="232" rx="10" fill="#101114"/>
