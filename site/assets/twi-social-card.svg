<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Worker Investor social card</title>
  <desc id="desc">A social preview card for The Worker Investor.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#101114" stroke-opacity=".06" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f6f4ed"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#fffdf7" stroke="#101114" stroke-opacity=".16"/>
  <rect x="54" y="54" width="1092" height="10" fill="#4b3fb4"/>
  <text x="90" y="122" fill="#4b3fb4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="800" letter-spacing="4">THE WORKER INVESTOR</text>
  <text x="90" y="244" fill="#101114" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="76" font-weight="700">
    <tspan x="90" dy="0">工资之外，</tspan>
    <tspan x="90" dy="86">不是工作之外。</tspan>
  </text>
  <text x="92" y="430" fill="#343842" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700">
    <tspan x="92" dy="0">Wages settle labor. Assets preserve labor.</tspan>
    <tspan x="92" dy="48">A book, research archive, and practical toolkit.</tspan>
  </text>
  <g transform="translate(914 128)">
    <rect x="0" y="0" width="178" height="278" rx="8" fill="#101114"/>
    <rect x="20" y="20" width="138" height="238" rx="4" fill="#172033"/>
    <text x="42" y="86" fill="#fffdf7" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">
      <tspan x="42" dy="0">The</tspan>
      <tspan x="42" dy="36">Worker</tspan>
      <tspan x="42" dy="36">Investor</tspan>
    </text>
    <text x="42" y="214" fill="#fffdf7" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800">工资之外</text>
  </g>
  <text x="90" y="540" fill="#6a6f78" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="800">WAGES -> ASSETS -> OPTIONALITY</text>
</svg>
