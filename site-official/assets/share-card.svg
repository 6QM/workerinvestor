<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Worker Investor / 工资之外</title>
  <desc id="desc">A code-native share card for The Worker Investor, showing the chain from wages to optionality.</desc>
  <rect width="1200" height="630" fill="#F7F8F5"/>
  <path d="M80 92H1120M80 172H1120M80 252H1120M80 332H1120M80 412H1120M80 492H1120" stroke="#D9DED7" stroke-width="1"/>
  <path d="M170 70V540M330 70V540M490 70V540M650 70V540M810 70V540M970 70V540" stroke="#D9DED7" stroke-width="1"/>
  <text x="82" y="90" fill="#14573D" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="2">PUBLIC WRITING LAB</text>
  <text x="82" y="234" fill="#101713" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700">The Worker Investor</text>
  <text x="82" y="326" fill="#14573D" font-family="'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="74" font-weight="700">工资之外</text>
  <text x="84" y="390" fill="#354139" font-family="'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="30">把工资、技能、内容和系统转化为未来选择权。</text>
  <g transform="translate(84 470)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700">
    <rect x="0" y="0" width="1028" height="70" rx="12" fill="#111914"/>
    <text x="34" y="44" fill="#D4C17C">WAGES</text>
    <text x="170" y="44" fill="#F7F8F5">→</text>
    <text x="222" y="44" fill="#F7F8F5">SAVINGS</text>
    <text x="374" y="44" fill="#F7F8F5">→</text>
    <text x="426" y="44" fill="#F7F8F5">SKILLS</text>
    <text x="560" y="44" fill="#F7F8F5">→</text>
    <text x="612" y="44" fill="#F7F8F5">CONTENT</text>
    <text x="770" y="44" fill="#F7F8F5">→</text>
    <text x="822" y="44" fill="#AEE0C8">OPTIONALITY</text>
  </g>
</svg>
